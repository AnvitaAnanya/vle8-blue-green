---
- name: Validate VLE-8 DevOps host
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Confirm Docker is installed
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Confirm kubectl is installed
      ansible.builtin.command: kubectl version --client
      changed_when: false

    - name: Confirm Minikube is installed
      ansible.builtin.command: minikube version
      changed_when: false

    - name: Display deployment information
      ansible.builtin.debug:
        msg: "VLE-8 Blue-Green environment validation completed."
